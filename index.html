<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Nunito, sans-serif; background: #f5f0ea; color: #1a1a1a; }
    #root { width: 100%; height: 100vh; }
    .container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .logo { width: 50px; height: 50px; background: #a366cc; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; margin: 0 auto 20px; }
    h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #888; text-align: center; margin-bottom: 24px; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
    button { width: 100%; padding: 10px; background: #a366cc; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { background: #8b4fb5; }
    .toggle { text-align: center; font-size: 13px; margin-top: 16px; }
    .toggle button { width: auto; background: none; color: #a366cc; padding: 0; margin: 0; }
    .toggle button:hover { text-decoration: underline; }
    .error { color: #c41e3a; font-size: 12px; margin-bottom: 12px; }
    .loading { text-align: center; color: #888; }
    .spinner { width: 30px; height: 30px; border: 3px solid #ddd; border-top-color: #a366cc; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .welcome { text-align: center; }
    .welcome h2 { font-size: 28px; margin-bottom: 16px; }
    .welcome p { color: #888; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="container">
      <div class="card">
        <div class="spinner"></div>
        <div class="loading">Loading Family Hub...</div>
      </div>
    </div>
  </div>

  <!-- Firebase using compat CDN (guaranteed to work) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    // Initialize when this script runs (compat versions guarantee firebase exists)
    const firebaseConfig = {
      apiKey: "AIzaSyAG__3I_UfExpHiVAsf2ev9CY3flmmlnbQ",
      authDomain: "haribo-82b77.firebaseapp.com",
      projectId: "haribo-82b77",
      storageBucket: "haribo-82b77.firebasestorage.app",
      messagingSenderId: "437120438002",
      appId: "1:437120438002:web:52c2746b6553fafbe24a6b"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      let currentUser = null;

      auth.onAuthStateChanged((user) => {
        currentUser = user;
        render();
      });

      function render() {
        const root = document.getElementById('root');
        
        if (!currentUser) {
          root.innerHTML = `
            <div class="container">
              <div class="card">
                <div class="logo">JY</div>
                <h1>Family Hub</h1>
                <p class="subtitle" id="subtitle">Welcome back</p>
                <div id="error" class="error" style="display:none;"></div>
                
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Password (6+ chars)" />
                <input type="text" id="name" placeholder="Name (optional)" style="display:none;" />
                
                <button id="submitBtn">Sign In</button>
                
                <div class="toggle">
                  <button id="toggleBtn">Need account? Sign Up</button>
                </div>
              </div>
            </div>
          `;

          let isSignup = false;
          const emailInput = document.getElementById('email');
          const passwordInput = document.getElementById('password');
          const nameInput = document.getElementById('name');
          const submitBtn = document.getElementById('submitBtn');
          const toggleBtn = document.getElementById('toggleBtn');
          const subtitle = document.getElementById('subtitle');
          const errorDiv = document.getElementById('error');

          toggleBtn.onclick = () => {
            isSignup = !isSignup;
            nameInput.style.display = isSignup ? 'block' : 'none';
            submitBtn.textContent = isSignup ? 'Create Account' : 'Sign In';
            toggleBtn.textContent = isSignup ? 'Already have account? Sign In' : 'Need account? Sign Up';
            subtitle.textContent = isSignup ? 'Create account' : 'Welcome back';
            errorDiv.style.display = 'none';
          };

          submitBtn.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const name = nameInput.value.trim();

            if (!email || !password || (isSignup && password.length < 6)) {
              errorDiv.textContent = 'Please fill all fields (password 6+ chars)';
              errorDiv.style.display = 'block';
              return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';

            try {
              if (isSignup) {
                const result = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(result.user.uid).set({
                  uid: result.user.uid,
                  email: email,
                  name: name || email.split('@')[0]
                });
              } else {
                await auth.signInWithEmailAndPassword(email, password);
              }
            } catch (error) {
              errorDiv.textContent = error.message;
              errorDiv.style.display = 'block';
              submitBtn.disabled = false;
              submitBtn.textContent = isSignup ? 'Create Account' : 'Sign In';
            }
          };
        } else {
          root.innerHTML = `
            <div class="container">
              <div class="card welcome">
                <div class="logo">✓</div>
                <h2>Welcome!</h2>
                <p>Logged in as:<br/><strong>${currentUser.email}</strong></p>
                <div style="background: #f5f0ea; padding: 16px; border-radius: 6px; margin-bottom: 20px; text-align: left; font-size: 13px; line-height: 1.8;">
                  <strong>Your Family Hub includes:</strong><br/>
                  ✓ Shared calendar<br/>
                  ✓ Budget tracking<br/>
                  ✓ Account manager<br/>
                  ✓ Mobile app support
                </div>
                <button id="signoutBtn">Sign Out</button>
              </div>
            </div>
          `;

          document.getElementById('signoutBtn').onclick = () => auth.signOut();
        }
      }

      render();
    } catch (error) {
      console.error('Firebase init error:', error);
      document.getElementById('root').innerHTML = `
        <div class="container">
          <div class="card" style="text-align: center;">
            <h2>Error</h2>
            <p style="color: red;">${error.message}</p>
            <p>Please try refreshing the page</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
