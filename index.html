<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Hub">
  <title>Family Hub - Shared Calendar & Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      margin: 0;
      background: oklch(96% 0.02 70);
      font-family: 'Nunito', sans-serif;
      color: oklch(28% 0.03 50);
    }
    #root { width: 100%; height: 100%; }
    input, select, textarea { font-family: 'Nunito', sans-serif; }
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: oklch(96% 0.02 70);
      gap: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid oklch(88% 0.02 70);
      border-top-color: oklch(64% 0.15 45);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Loading Family Hub...</p>
    </div>
  </div>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Firebase (Global) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"></script>

  <script>
    // Wait for Firebase to load
    function waitForFirebase() {
      return new Promise((resolve) => {
        if (typeof firebase !== 'undefined' && firebase.initializeApp) {
          resolve();
        } else {
          setTimeout(() => waitForFirebase().then(resolve), 100);
        }
      });
    }

    waitForFirebase().then(() => {
      // Firebase config
      const config = {
        apiKey: "AIzaSyAG__3I_UfExpHiVAsf2ev9CY3flmmlnbQ",
        authDomain: "haribo-82b77.firebaseapp.com",
        projectId: "haribo-82b77",
        storageBucket: "haribo-82b77.firebasestorage.app",
        messagingSenderId: "437120438002",
        appId: "1:437120438002:web:52c2746b6553fafbe24a6b"
      };

      firebase.initializeApp(config);
      const auth = firebase.auth();
      const db = firebase.firestore();

      let currentUser = null;

      // Watch auth state
      auth.onAuthStateChanged(user => {
        currentUser = user;
        render();
      });

      // Login handler
      function handleLogin(email, password) {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert('Error: ' + err.message));
      }

      // Signup handler
      function handleSignup(email, password, name) {
        auth.createUserWithEmailAndPassword(email, password)
          .then(result => {
            db.collection('users').doc(result.user.uid).set({
              email, name: name || email.split('@')[0]
            }).catch(err => console.error(err));
          })
          .catch(err => alert('Error: ' + err.message));
      }

      // Logout handler
      function handleLogout() {
        auth.signOut();
      }

      // Login Screen
      function LoginScreen() {
        const [email, setEmail] = React.useState('');
        const [password, setPassword] = React.useState('');
        const [name, setName] = React.useState('');
        const [isSignup, setIsSignup] = React.useState(false);

        return React.createElement('div', {
          style: {
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            minHeight: '100vh',
            background: 'oklch(96% 0.02 70)',
            padding: '20px'
          }
        },
          React.createElement('div', {
            style: {
              maxWidth: '400px',
              width: '100%',
              background: 'white',
              borderRadius: '18px',
              padding: '40px 32px',
              boxShadow: '0 4px 12px rgba(0,0,0,0.08)'
            }
          },
            React.createElement('div', { style: { textAlign: 'center', marginBottom: '32px' } },
              React.createElement('div', {
                style: {
                  width: '50px',
                  height: '50px',
                  borderRadius: '12px',
                  background: 'oklch(64% 0.15 45)',
                  margin: '0 auto 16px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  color: 'white',
                  fontSize: '24px',
                  fontWeight: 700
                }
              }, 'JY'),
              React.createElement('h1', { style: { margin: 0, fontSize: '24px', marginBottom: '8px' } }, 'Family Hub'),
              React.createElement('p', { style: { margin: 0, fontSize: '14px', color: 'oklch(55% 0.02 50)' } }, 
                isSignup ? 'Create account' : 'Welcome back'
              )
            ),
            React.createElement('form', {
              onSubmit: (e) => {
                e.preventDefault();
                isSignup ? handleSignup(email, password, name) : handleLogin(email, password);
              },
              style: { display: 'flex', flexDirection: 'column', gap: '16px' }
            },
              React.createElement('input', {
                type: 'email',
                placeholder: 'Email',
                value: email,
                onChange: e => setEmail(e.target.value),
                required: true,
                style: {
                  padding: '10px 12px',
                  border: '1px solid oklch(88% 0.02 70)',
                  borderRadius: '9px',
                  fontSize: '14px'
                }
              }),
              React.createElement('input', {
                type: 'password',
                placeholder: 'Password (6+ chars)',
                value: password,
                onChange: e => setPassword(e.target.value),
                required: true,
                minLength: 6,
                style: {
                  padding: '10px 12px',
                  border: '1px solid oklch(88% 0.02 70)',
                  borderRadius: '9px',
                  fontSize: '14px'
                }
              }),
              isSignup && React.createElement('input', {
                type: 'text',
                placeholder: 'Name (optional)',
                value: name,
                onChange: e => setName(e.target.value),
                style: {
                  padding: '10px 12px',
                  border: '1px solid oklch(88% 0.02 70)',
                  borderRadius: '9px',
                  fontSize: '14px'
                }
              }),
              React.createElement('button', {
                type: 'submit',
                style: {
                  padding: '11px 16px',
                  background: 'oklch(64% 0.15 45)',
                  color: 'white',
                  border: 'none',
                  borderRadius: '9px',
                  fontSize: '14px',
                  fontWeight: 700,
                  cursor: 'pointer'
                }
              }, isSignup ? 'Create Account' : 'Sign In')
            ),
            React.createElement('div', {
              style: {
                textAlign: 'center',
                marginTop: '20px',
                fontSize: '13px'
              }
            },
              React.createElement('button', {
                type: 'button',
                onClick: () => setIsSignup(!isSignup),
                style: {
                  background: 'none',
                  border: 'none',
                  color: 'oklch(64% 0.15 45)',
                  fontWeight: 700,
                  cursor: 'pointer',
                  fontSize: '13px'
                }
              }, isSignup ? 'Already have account? Sign In' : 'Need account? Sign Up')
            )
          )
        );
      }

      // Welcome Screen
      function WelcomeScreen() {
        return React.createElement('div', {
          style: {
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            minHeight: '100vh',
            background: 'oklch(96% 0.02 70)',
            padding: '20px',
            textAlign: 'center'
          }
        },
          React.createElement('div', {
            style: {
              maxWidth: '500px',
              background: 'white',
              borderRadius: '18px',
              padding: '40px 32px'
            }
          },
            React.createElement('h1', { style: { fontSize: '32px', marginBottom: '16px' } }, '✅ Welcome!'),
            React.createElement('p', { style: { fontSize: '16px', color: 'oklch(55% 0.02 50)', marginBottom: '24px' } }, 
              'Logged in as: ' + (currentUser?.email || 'User')
            ),
            React.createElement('div', {
              style: {
                background: 'oklch(96% 0.02 70)',
                padding: '20px',
                borderRadius: '9px',
                marginBottom: '24px',
                textAlign: 'left'
              }
            },
              React.createElement('h3', { style: { marginTop: 0 } }, 'Features:'),
              React.createElement('ul', { style: { fontSize: '14px', lineHeight: '2' } },
                React.createElement('li', null, '📅 Shared calendar'),
                React.createElement('li', null, '💰 Budget tracking'),
                React.createElement('li', null, '🔐 Password manager'),
                React.createElement('li', null, '📱 Mobile app')
              )
            ),
            React.createElement('button', {
              onClick: handleLogout,
              style: {
                padding: '10px 20px',
                background: 'oklch(92% 0.02 70)',
                border: '1px solid oklch(88% 0.02 70)',
                borderRadius: '6px',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: 600
              }
            }, 'Sign Out')
          )
        );
      }

      // Render
      function render() {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(currentUser ? React.createElement(WelcomeScreen) : React.createElement(LoginScreen));
      }

      render();
    });
  </script>
</body>
</html>
